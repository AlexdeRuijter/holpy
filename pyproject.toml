[project]
name = "holpy"
version = "0.1.0"
description = "Higher-order logic theorem prover and proof assistant in Python"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Bohua Zhan", email = "bzhan@ios.ac.cn" },
    { name = "Alex de Ruijter", email = "A.L.deRuijter@tudelft.nl" },
]
maintainers = [
    { name = "Alex de Ruijter", email = "A.L.deRuijter@tudelft.nl" },
]
keywords = [
    "HOL",
    "higher-order logic",
    "theorem prover",
    "proof assistant",
    "formal verification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "lark>=1.1",
    "sympy>=1.9",
    "z3-solver>=4.12,<5.3.3",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest>=8",
    "ruff",
    "twine",
]

[project.urls]
Homepage = "https://github.com/AlexdeRuijter/holpy"
Repository = "https://github.com/AlexdeRuijter/holpy"
Issues = "https://github.com/AlexdeRuijter/holpy/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["holpy"]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "**/tests/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "holpy",
    "docs",
    "scripts",
    "README.md",
    "README_cn.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["holpy"]
python_files = ["*_test.py"]
