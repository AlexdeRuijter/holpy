[project]
name = "holpy"
version = "0.1.0"

requires-python = ">=3.13"
dependencies = [
    "alive-progress>=2.4.1",
    "flask>=2.0.2",
    "flask-cors>=3.0.10",
    "lark-parser>=0.12.0",
    "six>=1.16.0",
    "sympy>=1.9",
    "traceback2>=1.4.0",
    "z3-solver>=4.8.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "holpy",
    "app",
    "data",
    "geometry",
    "imperative",
    "integral",
    "kernel",
    "logic",
    "paraverifier",
    "prover",
    "server",
    "syntax",
    "util",
]
