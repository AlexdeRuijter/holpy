  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with: { python-version: "3.12" }
  #     - run: pip install -e ".[dev]"
  #     - run: python scripts/check_library.py --jobs 2 --out docs/library_check.tsv
  #     - run: python scripts/check_library.py --compare docs/library_check.tsv docs/library_check.tsv || true
