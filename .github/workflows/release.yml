name: Release

# Publishes to PyPI when a version tag such as v0.1.0 or v0.1.0a1 is pushed.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in GitHub.
# One-time setup is described in docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest holpy -q -p no:cacheprovider --continue-on-collection-errors -rfE | tee pytest.txt
      - run: python scripts/compare_test_baseline.py pytest.txt docs/test_baseline.txt
      # macOS and Windows are deliberately not part of the release gate; they run in CI.

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Tag must match the version in pyproject.toml
        run: |
          python - <<'EOF'
          import os, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match pyproject version {version}")
          EOF
      - run: python -m build
      - run: twine check dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          ./venv/bin/python -c "import holpy; print(holpy.__version__); from holpy.logic import basic; basic.load_theory('real')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Create a GitHub environment named "pypi" (optionally with required reviewers)
    # and register the same name in the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/holpy
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
